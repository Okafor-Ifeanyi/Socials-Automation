name: Automated Content Posting

on:
  # Run on a schedule (cron)
  schedule:
    # Every Monday, Wednesday, Friday at 9:00 AM UTC
    - cron: '0 9 * * 1,3,5'
  
  # Allow manual triggering from GitHub UI
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional: Specific topic to post about'
        required: false
        type: string
      publish_now:
        description: 'Publish immediately instead of scheduling'
        required: false
        type: boolean
        default: false

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run automated posting
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LATE_API_KEY: ${{ secrets.LATE_API_KEY }}
          LATE_TWITTER_ACCOUNT_ID: ${{ secrets.LATE_TWITTER_ACCOUNT_ID }}
          LATE_LINKEDIN_ACCOUNT_ID: ${{ secrets.LATE_LINKEDIN_ACCOUNT_ID }}
          SCHEDULE_POSTS: ${{ github.event.inputs.publish_now != 'true' }}
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            echo "Manual topic provided: ${{ github.event.inputs.topic }}"
            npm run generate -- "${{ github.event.inputs.topic }}" --publish
          else
            echo "Running automated topic selection"
            npx tsx src/auto-poster.ts
          fi
      
      - name: Commit updated topics.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/topics.json automation-logs.jsonl || true
          git diff --staged --quiet || git commit -m "chore: update used topics [skip ci]"
          git push || true
      
      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-logs-${{ github.run_number }}
          path: automation-logs.jsonl
          retention-days: 30